:root {
  /* ============================================================
     COLORS — 90s candy palette
     Each "page color" is a saturated mid-tone background.
     White text sits on top with drop shadow for depth.
     ============================================================ */

  /* Brand signature gradient (book cover) */
  --grad-cover: radial-gradient(circle at 50% 55%, #FF8B5C 0%, #FF5BA0 35%, #C957C9 70%, #9F4FB8 100%);
  --grad-sunset: linear-gradient(135deg, #FFB87A 0%, #FF6FA8 50%, #E84B9C 100%);
  --grad-peach-pink: linear-gradient(180deg, #FFB37A 0%, #FF7FA8 100%);

  /* Page-block colors (lifted directly from book spreads) */
  --pg-pink:        #E04F8E;   /* hot bubblegum (Ch.7, Abundance) */
  --pg-pink-light: #E893B8;    /* softer pink (Ch.2 Self-Concept) */
  --pg-coral:       #E15549;   /* salmon-coral (Gratitude, How to Script) */
  --pg-teal:        #2E8C8C;   /* deep seafoam (Money, Daily Framework) */
  --pg-teal-deep:   #1F7374;   /* darker variant */
  --pg-lavender:    #9E85C8;   /* purple-lavender (Limiting Belief) */
  --pg-grape:       #7E5BAF;   /* deeper purple (Aligned Action) */
  --pg-periwinkle:  #6B6BD9;   /* indigo-blue (How to Visualize) */
  --pg-cream:       #F4D5A8;   /* peachy cream */

  /* Vibrant accents — neon pop */
  --neon-yellow:    #F7E84B;   /* highlighter yellow */
  --neon-lime:      #D8FF3C;   /* highlight lime */
  --neon-mustard:   #C9B544;   /* mustard yellow */
  --neon-cyan:      #7BE0E8;   /* sky cyan */
  --neon-pink:      #FF6FA8;   /* candy pink */
  --neon-magenta:   #FF4FB6;   /* hot magenta */
  --neon-coral:     #FF8B5C;   /* coral pop */

  /* Text */
  --fg1:           #FFFFFF;    /* primary on-color text */
  --fg1-shadow:    rgba(0,0,0,0.18);
  --fg-ink:        #1A1213;    /* near-black plum (copyright pages) */
  --fg-ink-soft:   #3A2A2D;
  --fg-muted:      rgba(255,255,255,0.75);
  --fg-muted-deep: rgba(0,0,0,0.55);

  /* Surfaces */
  --surface-cream: #FFF4E3;    /* off-white page */
  --surface-white: #FFFFFF;
  --surface-dark:  #1A1213;

  /* Borders / dividers */
  --border-soft:   rgba(255,255,255,0.35);
  --border-ink:    rgba(0,0,0,0.85);

  /* ============================================================
     TYPOGRAPHY — base families
     ============================================================ */
  --font-display:  "Anton", "Impact", sans-serif;             /* tall condensed sans, ALL CAPS chapter heads */
  --font-comic:    "Bungee", "Bungee Shade", system-ui;       /* chunky outlined comic display */
  --font-comic-3d: "Bungee Shade", "Bungee", system-ui;       /* 3D-shadowed variant */
  --font-italic:   "Playfair Display", Georgia, serif;        /* italic serif subtitles */
  --font-script:   "Pacifico", "Brush Script MT", cursive;    /* cursive labels */
  --font-brush:    "Caveat Brush", "Marker Felt", cursive;    /* loose marker brush */
  --font-body:     "Lora", "Georgia", serif;                  /* body paragraphs */
  --font-mono:     "VT323", "Courier New", monospace;         /* 90s terminal */
  --font-pixel:    "Press Start 2P", "VT323", monospace;      /* 8-bit pixel display */

  /* ============================================================
     SEMANTIC TYPE TOKENS
     ============================================================ */
  --type-h1-family: var(--font-display);
  --type-h1-size: clamp(48px, 7vw, 96px);
  --type-h1-weight: 400;
  --type-h1-leading: 0.9;
  --type-h1-tracking: -0.01em;
  --type-h1-case: uppercase;

  --type-h2-family: var(--font-display);
  --type-h2-size: clamp(36px, 5vw, 64px);
  --type-h2-weight: 400;
  --type-h2-leading: 1.0;
  --type-h2-case: uppercase;

  --type-h3-family: var(--font-italic);
  --type-h3-style: italic;
  --type-h3-size: clamp(28px, 3.4vw, 44px);
  --type-h3-weight: 700;

  --type-eyebrow-family: var(--font-display);
  --type-eyebrow-size: 14px;
  --type-eyebrow-tracking: 0.2em;
  --type-eyebrow-case: uppercase;

  --type-script-family: var(--font-script);
  --type-script-size: clamp(22px, 2.4vw, 32px);

  --type-body-family: var(--font-body);
  --type-body-size: 17px;
  --type-body-leading: 1.55;

  --type-quote-family: var(--font-italic);
  --type-quote-style: italic;
  --type-quote-size: 22px;

  /* ============================================================
     SHADOWS / EFFECTS
     ============================================================ */
  --shadow-text-soft: 0 2px 0 rgba(0,0,0,0.18), 0 4px 14px rgba(0,0,0,0.12);
  --shadow-text-bold: 3px 3px 0 rgba(0,0,0,0.85);            /* hard offset 90s */
  --shadow-text-3d:   2px 2px 0 #1A1213, 4px 4px 0 #1A1213, 6px 6px 0 #1A1213;
  --glow-yellow:      0 0 12px rgba(247,232,75,0.7), 0 0 24px rgba(247,232,75,0.4);
  --glow-pink:        0 0 12px rgba(255,79,182,0.7), 0 0 28px rgba(255,79,182,0.4);
  --glow-cyan:        0 0 10px rgba(123,224,232,0.8), 0 0 22px rgba(123,224,232,0.5);

  --shadow-card:       0 6px 18px rgba(26,18,19,0.18);
  --shadow-card-hover: 0 10px 28px rgba(26,18,19,0.28);
  --shadow-card-pop:   6px 6px 0 #1A1213;                    /* hard offset 90s sticker */

  /* Highlight tape (rotated colored bar behind a word) */
  --tape-yellow: var(--neon-yellow);
  --tape-pink:   var(--neon-magenta);
  --tape-lime:   var(--neon-lime);
  --tape-cyan:   var(--neon-cyan);

  /* ============================================================
     SPACING / RADII
     ============================================================ */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;

  --radius-xs: 4px;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 22px;
  --radius-xl: 32px;
  --radius-pill: 999px;

  /* Motion */
  --ease-bounce: cubic-bezier(.34,1.56,.64,1);
  --ease-out:    cubic-bezier(.2,.7,.2,1);
  --dur-fast:    140ms;
  --dur-base:    240ms;
  --dur-slow:    420ms;
}

/* ============================================================
   BASE ELEMENT STYLES (semantic tags)
   ============================================================ */
.ab-h1, h1.ab {
  font-family: var(--type-h1-family);
  font-size: var(--type-h1-size);
  font-weight: var(--type-h1-weight);
  line-height: var(--type-h1-leading);

  <style>/* landing.css — page-level styles for the Alchemist Behavior landing page */

html, body {
  margin: 0;
  padding: 0;
  background: #FFF4E3;
  color: var(--fg-ink);
  font-family: var(--font-body);
  scroll-behavior: smooth;
}
* { box-sizing: border-box; }

/* === Section scaffolding === */
.section {
  position: relative;
  padding: 96px 32px;
  overflow: hidden;
}
.section__inner {
  max-width: 1180px;
  margin: 0 auto;
}

/* === Sticker pop button === */
.btn-pop {
  font-family: var(--font-display);
  font-size: 18px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: var(--neon-yellow);
  color: var(--fg-ink);
  border: 2.5px solid var(--fg-ink);
  border-radius: 14px;
  padding: 14px 22px;
  box-shadow: 5px 5px 0 var(--fg-ink);
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
  display: inline-flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}
.btn-pop:hover {
  transform: translate(2px, 2px);
  box-shadow: 3px 3px 0 var(--fg-ink);
}
.btn-pop:active {
  transform: translate(5px, 5px);
  box-shadow: 0 0 0 var(--fg-ink);
}
.btn-pop--pink   { background: var(--neon-magenta); color: #fff; }
.btn-pop--cyan   { background: var(--neon-cyan); }
.btn-pop--coral  { background: var(--neon-coral); color: #fff; }
.btn-pop--ghost  { background: transparent; box-shadow: none; }
.btn-pop--ghost:hover { background: rgba(0,0,0,0.06); transform: none; box-shadow: none; }

/* === Card pop === */
.card-pop {
  background: #fff;
  border: 2.5px solid var(--fg-ink);
  border-radius: 18px;
  box-shadow: 6px 6px 0 var(--fg-ink);
  transition: transform var(--dur-base) var(--ease-bounce);
}
.card-pop:hover {
  transform: rotate(-1deg) translate(-2px, -2px);
}

/* === Highlight tape === */
.tape {
  display: inline-block;
  padding: 0 0.18em;
  transform: rotate(-3deg);
  box-shadow: 3px 3px 0 rgba(0,0,0,0.85);
}

/* === Eyebrow === */
.eyebrow {
  font-family: var(--font-display);
  font-size: 14px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--fg-ink);
}

/* === Section heading === */
.s-h1 {
  font-family: var(--font-display);
  font-size: clamp(48px, 7vw, 92px);
  line-height: 0.92;
  text-transform: uppercase;
  margin: 0;
  letter-spacing: -0.005em;
}
.s-italic {
  font-family: var(--font-italic);
  font-style: italic;
  font-weight: 700;
}

/* === Floating sparkle === */
@keyframes float-y {
  0%,100% { transform: translateY(0) rotate(0deg); }
  50%     { transform: translateY(-8px) rotate(6deg); }
}
.sparkle-float { animation: float-y 4s ease-in-out infinite; display: inline-block; }

/* === Marquee === */
@keyframes marquee {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

/* === Modal === */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(26,18,19,0.65);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  padding: 20px;
}
.modal {
  width: 100%; max-width: 480px;
  background: var(--surface-cream);
  border: 2.5px solid var(--fg-ink);
  border-radius: 22px;
  box-shadow: 8px 8px 0 var(--fg-ink);
  padding: 28px;
  position: relative;
}

/* === Celebration overlay === */
@keyframes pop-in {
  0%   { transform: scale(0.6); opacity: 0; }
  60%  { transform: scale(1.08); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
.celebrate {
  animation: pop-in 480ms var(--ease-bounce) both;
}

/* === Scroll-spy nav === */
.nav-link.active {
  color: var(--neon-magenta);
}

/* ==============================================
   RESPONSIVE — tablet + phone
   ============================================== */

/* Tablet & below */
@media (max-width: 900px) {
  .section { padding: 64px 22px; }

  /* Nav: shrink links, allow wrap */
  nav .nav-inner { padding: 12px 20px !important; }
  nav a.nav-brand-text { font-size: 18px !important; }
  nav .nav-links { gap: 16px !important; }

  /* Hero — stack book under copy, recenter */
  .hero-grid {
    grid-template-columns: 1fr !important;
    gap: 36px !important;
    text-align: left;
    min-height: auto !important;
  }
  .hero-book-wrap img { width: 240px !important; }
  .hero-book-wrap .hero-halo {
    width: 280px !important; height: 280px !important;
  }

  /* All 3-col / 2-col grids → stack to 2 cols, then 1 */
  .grid-3, .grid-2, .footer-grid {
    grid-template-columns: 1fr 1fr !important;
  }

  /* Book section — stack image above copy */
  .book-grid {
    grid-template-columns: 1fr !important;
    gap: 36px !important;
  }

  /* Headlines a touch tighter */
  .s-h1 { font-size: clamp(40px, 9vw, 72px) !important; }
}

/* Phone */
@media (max-width: 640px) {
  .section { padding: 56px 18px; }

  /* Hide non-essential nav links — keep brand + CTA */
  nav .nav-links a:not(.nav-cta) { display: none !important; }
  nav .nav-links { gap: 10px !important; }

  /* Hero copy */
  .hero-eyebrow {
    font-size: 11px !important;
    padding: 6px 11px !important;
  }
  .hero-grid { padding: 0 18px !important; }
  .hero-grid h1 { font-size: clamp(44px, 12vw, 64px) !important; }
  .hero-grid p { font-size: 17px !important; }
  .hero-book-wrap img {
    width: 200px !important;
    box-shadow: 6px 6px 0 #1A1213, 10px 10px 0 var(--neon-yellow) !important;
  }
  .hero-book-wrap .hero-halo {
    width: 220px !important; height: 220px !important;
  }
  .hero-stats { gap: 16px !important; }
  .hero-stats > div > div:first-child { font-size: 30px !important; }

  /* All grids → single column */
  .grid-3, .grid-2, .footer-grid, .chapters-grid, .order-form-row {
    grid-template-columns: 1fr !important;
  }

  /* Footer alignment */
  .footer-grid { gap: 28px !important; }

  /* Buttons */
  .btn-pop {
    font-size: 15px !important;
    padding: 12px 18px !important;
    box-shadow: 4px 4px 0 var(--fg-ink);
  }

  /* Section titles */
  .s-h1 { font-size: clamp(36px, 11vw, 56px) !important; }

  /* Marquee — smaller text */
  .marquee-track { font-size: 32px !important; }

  /* Modal */
  .modal { padding: 22px 20px; border-radius: 18px; }

  /* Cards a bit tighter */
  .card-pop { box-shadow: 4px 4px 0 var(--fg-ink); }

  /* Program headline plate */
  .program-plate { padding: 18px 22px 22px !important; }
}
